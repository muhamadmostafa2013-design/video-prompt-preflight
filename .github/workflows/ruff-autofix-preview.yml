name: ruff-autofix-preview
on:
  push:
    branches: ['fix/vpp-0.5.3-deep-hardening']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - name: Preview safe automatic fixes without writing to GitHub
        shell: bash
        run: |
          ruff check --fix . || true
          python - <<'PY'
          import base64
          import json
          import pathlib
          import subprocess
          files = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          data = {p: pathlib.Path(p).read_text(encoding="utf-8") for p in files}
          print("VPP_AUTOFIX_PAYLOAD_START")
          print(base64.b64encode(json.dumps(data,ensure_ascii=False).encode()).decode())
          print("VPP_AUTOFIX_PAYLOAD_END")
          PY
      - name: List any lint issues not safely auto-fixable
        run: ruff check . || true
