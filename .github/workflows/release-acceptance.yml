name: release-acceptance
on:
  push:
    branches: [main, 'fix/vpp-0.5.1-release-gates', 'fix/claude-audit-high-severity', 'fix/vpp-0.5.3-deep-hardening']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ten-release-gates:
    name: 10 real acceptance gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare real video and local OCR tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - name: Install tested package with offline OCR extra
        run: python -m pip install -e '.[dev,media-ocr]'
      - name: Gate 1–10 | Real acceptance tests
        run: pytest -vv tests/test_release_acceptance.py --junitxml=release-acceptance.xml
      - name: Verify installed wheel includes failure-memory corpus
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/vpp-dist
          python -m venv /tmp/vpp-isolated
          /tmp/vpp-isolated/bin/pip install --no-deps /tmp/vpp-dist/*.whl
          (cd /tmp && /tmp/vpp-isolated/bin/python -c "from vpp.failure_memory import load_failure_memory; assert len(load_failure_memory()) >= 3")
      - name: Browser JS syntax check
        run: |
          for f in web/*.js; do node --check "$f"; done
      - name: Browser DOM and shared Python/JS semantic conformance
        run: node --test tests/browser_smoke.cjs tests/browser_conformance.cjs
      - name: Ruff full lint
        run: ruff check .
      - name: Full Python regression suite
        run: pytest -q
      - name: Upload exact acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-results
          path: release-acceptance.xml
          if-no-files-found: warn
          retention-days: 14
